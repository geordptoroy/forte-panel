services:
  # ============================================================================
  # BANCOS DE DADOS E ARMAZENAMENTO
  # ============================================================================
  postgres_papi:
    image: postgres:13-alpine
    container_name: postgres_papi
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres123"
      POSTGRES_DB: pastorini
    volumes:
      - postgres_papi_data:/var/lib/postgresql/data
    networks:
      - pastorini-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_n8n:
    image: postgres:15-alpine
    container_name: postgres_n8n
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n123
      POSTGRES_DB: n8n
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    networks:
      - pastorini-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_panel:
    image: postgres:16-alpine
    container_name: postgres_panel
    restart: unless-stopped
    environment:
      POSTGRES_USER: forte_panel
      POSTGRES_PASSWORD: forte_panel_local
      POSTGRES_DB: forte_panel
    volumes:
      - postgres_panel_data:/var/lib/postgresql/data
    networks:
      - pastorini-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forte_panel -d forte_panel"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis_papi:
    image: redis:7-alpine
    container_name: redis_papi
    restart: unless-stopped
    volumes:
      - redis_papi_data:/data
    networks:
      - pastorini-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_panel:
    image: redis:7-alpine
    container_name: redis_panel
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_panel_data:/data
    networks:
      - pastorini-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================================
  # ORQUESTRADOR DE AUTOMAÇÕES (N8N)
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n123
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - N8N_AI_TIMEOUT=3600000
      - N8N_CUSTOM_EXTENSIONS=@aorizondo/n8n-nodes-evolution,n8n-evolution-tools,n8n-nodes-mcp
    volumes:
      - n8n_data:/home/node/.n8n
      - /mnt/c/Users/Rafae/Desktop/audios:/home/node/midias
    depends_on:
      postgres_n8n:
        condition: service_healthy
    networks:
      - pastorini-network

  # ============================================================================
  # CANAL DE COMUNICAÇÃO (WHATSAPP)
  # ============================================================================
  pastorini_api:
    image: intrategica/papi-free:1.5.2
    container_name: pastorini_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PANEL_API_KEY: "teste123"
      STORAGE_TYPE: postgres+redis
      POSTGRES_HOST: postgres_papi
      POSTGRES_PORT: 5432
      POSTGRES_DB: pastorini
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres123"
      POSTGRES_SSL: "false"
      REDIS_HOST: redis_papi
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      LICENSE_KEY: "93FCC67B-950C58A6-3A68BCEF-C77B80F0"
    volumes:
      - pastorini_sessions:/app/sessions
      - pastorini_media:/app/Media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres_papi:
        condition: service_healthy
      redis_papi:
        condition: service_healthy
    networks:
      - pastorini-network

  # ============================================================================
  # CRM FORTE PANEL - SERVIDOR WEB
  # ============================================================================
  forte-panel:
    image: ghcr.io/geordptoroy/forte-panel:sha-8b1082d
    container_name: forte_panel
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DEMO_MODE: "false"
      LOCAL_AUTH_ENABLED: "true"
      LOCAL_ADMIN_EMAIL: admin@fortepanel.local
      LOCAL_ADMIN_PASSWORD: trocar-esta-senha
      JWT_SECRET: troque-por-uma-chave-jwt-com-mais-de-32-caracteres
      FORTE_API_KEY: "teste-panel-local"
      WEBHOOK_SIGNING_SECRET: "teste-webhook-local"
      DATABASE_URL: postgresql://forte_panel:forte_panel_local@postgres_panel:5432/forte_panel
      REDIS_URL: redis://redis_panel:6379/0
      RUN_MIGRATIONS: "true"
      PAPI_BASE_URL: http://pastorini_api:3000
      PAPI_API_KEY: "teste123"
      PAPI_SEND_MESSAGE_PATH: /messages
      N8N_BASE_URL: http://n8n:5678
      N8N_EVENTS_WEBHOOK_URL: ""
      N8N_WEBHOOK_SECRET: ""
      N8N_WEBHOOK_TIMEOUT_MS: "10000"
      META_GRAPH_API_VERSION: v23.0
      META_WHATSAPP_ACCESS_TOKEN: ""
      META_WHATSAPP_PHONE_NUMBER_ID: ""
    depends_on:
      postgres_panel:
        condition: service_healthy
      redis_panel:
        condition: service_healthy
      pastorini_api:
        condition: service_started
      n8n:
        condition: service_started
    networks:
      - pastorini-network

  # ============================================================================
  # CRM FORTE PANEL - WORKER DE ENVIO WHATSAPP
  # ============================================================================
  forte-panel-worker:
    image: ghcr.io/geordptoroy/forte-panel:sha-8b1082d
    container_name: forte_panel_worker
    restart: unless-stopped
    command: ["./docker-entrypoint.sh", "worker"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DEMO_MODE: "false"
      LOCAL_AUTH_ENABLED: "true"
      LOCAL_ADMIN_EMAIL: admin@fortepanel.local
      LOCAL_ADMIN_PASSWORD: trocar-esta-senha
      JWT_SECRET: troque-por-uma-chave-jwt-com-mais-de-32-caracteres
      FORTE_API_KEY: "teste-panel-local"
      WEBHOOK_SIGNING_SECRET: "teste-webhook-local"
      DATABASE_URL: postgresql://forte_panel:forte_panel_local@postgres_panel:5432/forte_panel
      REDIS_URL: redis://redis_panel:6379/0
      RUN_MIGRATIONS: "false"
      PAPI_BASE_URL: http://pastorini_api:3000
      PAPI_API_KEY: "teste123"
      PAPI_SEND_MESSAGE_PATH: /messages
      N8N_BASE_URL: http://n8n:5678
      N8N_EVENTS_WEBHOOK_URL: ""
      N8N_WEBHOOK_SECRET: ""
      N8N_WEBHOOK_TIMEOUT_MS: "10000"
      META_GRAPH_API_VERSION: v23.0
      META_WHATSAPP_ACCESS_TOKEN: ""
      META_WHATSAPP_PHONE_NUMBER_ID: ""
      WORKER_INTERVAL_MS: "1500"
      WORKER_BATCH_SIZE: "10"
      WORKER_MAX_ATTEMPTS: "3"
      EVENT_WORKER_BATCH_SIZE: "10"
      EVENT_WORKER_MAX_ATTEMPTS: "5"
    depends_on:
      postgres_panel:
        condition: service_healthy
      redis_panel:
        condition: service_healthy
      pastorini_api:
        condition: service_started
      forte-panel:
        condition: service_started
    networks:
      - pastorini-network

networks:
  pastorini-network:
    driver: bridge

volumes:
  postgres_papi_data:
  redis_papi_data:
  pastorini_sessions:
  pastorini_media:
  postgres_n8n_data:
  n8n_data:
  postgres_panel_data:
  redis_panel_data:
