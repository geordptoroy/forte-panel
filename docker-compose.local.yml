services:
  postgres_panel:
    image: postgres:16-alpine
    container_name: forte_postgres_panel
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PANEL_POSTGRES_DB:-forte_panel}
      POSTGRES_USER: ${PANEL_POSTGRES_USER:-forte_panel}
      POSTGRES_PASSWORD: ${PANEL_POSTGRES_PASSWORD:?PANEL_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${PANEL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - forte_postgres_panel_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${PANEL_POSTGRES_USER:-forte_panel} -d $${PANEL_POSTGRES_DB:-forte_panel}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [panel-network]

  redis_panel:
    image: redis:7-alpine
    container_name: forte_redis_panel
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - forte_redis_panel_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [panel-network]

  seaweedfs-config:
    image: alpine:3.20
    container_name: forte_seaweedfs_config
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"forte-panel","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write"]}]}'
        "$${FORTE_STORAGE_ACCESS_KEY}" "$${FORTE_STORAGE_SECRET_KEY}" > /config/s3.json
    environment:
      FORTE_STORAGE_ACCESS_KEY: ${FORTE_STORAGE_ACCESS_KEY:?FORTE_STORAGE_ACCESS_KEY is required}
      FORTE_STORAGE_SECRET_KEY: ${FORTE_STORAGE_SECRET_KEY:?FORTE_STORAGE_SECRET_KEY is required}
    volumes:
      - forte_seaweedfs_config:/config
    networks: [panel-network]

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: forte_seaweedfs
    restart: unless-stopped
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.port=8333",
        "-s3.config=/etc/seaweedfs/s3.json",
      ]
    ports:
      - "127.0.0.1:${FORTE_STORAGE_PORT:-8333}:8333"
    volumes:
      - forte_seaweedfs_data:/data
      - forte_seaweedfs_config:/etc/seaweedfs:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8333/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      seaweedfs-config: { condition: service_completed_successfully }
    networks: [panel-network]

  forte-panel-migrations:
    image: ${FORTE_PANEL_IMAGE:-ghcr.io/geordptoroy/forte-panel:latest}
    container_name: forte_panel_migrations
    restart: "no"
    command: ["./docker-entrypoint.sh", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${PANEL_POSTGRES_USER:-forte_panel}:${PANEL_POSTGRES_PASSWORD}@postgres_panel:5432/${PANEL_POSTGRES_DB:-forte_panel}
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres_panel: { condition: service_healthy }
    networks: [panel-network]

  forte-panel:
    image: ${FORTE_PANEL_IMAGE:-ghcr.io/geordptoroy/forte-panel:latest}
    container_name: forte_panel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DEMO_MODE: "false"
      WORKSPACE_BOOTSTRAP_ENABLED: ${WORKSPACE_BOOTSTRAP_ENABLED:-false}
      LOCAL_AUTH_ENABLED: "true"
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@fortepanel.local}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?LOCAL_ADMIN_PASSWORD is required}
      PLATFORM_ADMIN_ACCOUNTS_JSON: ${PLATFORM_ADMIN_ACCOUNTS_JSON:-}
      FORTE_LOGIN_RATE_LIMIT_WINDOW_MS: ${FORTE_LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      FORTE_LOGIN_RATE_LIMIT_STAGE_1_FAILURES: ${FORTE_LOGIN_RATE_LIMIT_STAGE_1_FAILURES:-5}
      FORTE_LOGIN_RATE_LIMIT_STAGE_1_BLOCK_MS: ${FORTE_LOGIN_RATE_LIMIT_STAGE_1_BLOCK_MS:-60000}
      FORTE_LOGIN_RATE_LIMIT_STAGE_2_FAILURES: ${FORTE_LOGIN_RATE_LIMIT_STAGE_2_FAILURES:-10}
      FORTE_LOGIN_RATE_LIMIT_STAGE_2_BLOCK_MS: ${FORTE_LOGIN_RATE_LIMIT_STAGE_2_BLOCK_MS:-180000}
      FORTE_LOGIN_RATE_LIMIT_STAGE_3_FAILURES: ${FORTE_LOGIN_RATE_LIMIT_STAGE_3_FAILURES:-15}
      FORTE_LOGIN_RATE_LIMIT_STAGE_3_BLOCK_MS: ${FORTE_LOGIN_RATE_LIMIT_STAGE_3_BLOCK_MS:-900000}
      PLATFORM_ADMIN_OPEN_IDS: ${PLATFORM_ADMIN_OPEN_IDS:-local_admin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FORTE_PUBLIC_API_ENABLED: ${FORTE_PUBLIC_API_ENABLED:-false}
      FORTE_API_KEY: ${FORTE_API_KEY:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      DATABASE_URL: postgresql://${PANEL_POSTGRES_USER:-forte_panel}:${PANEL_POSTGRES_PASSWORD}@postgres_panel:5432/${PANEL_POSTGRES_DB:-forte_panel}
      REDIS_URL: redis://redis_panel:6379/0
      FORTE_API_WORKSPACE_ID: ${FORTE_API_WORKSPACE_ID:-}
      RUN_MIGRATIONS: "false"
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3002}
      BAILEYS_REQUEST_TIMEOUT_MS: ${BAILEYS_REQUEST_TIMEOUT_MS:-8000}
      BAILEYS_BASE_URL: http://forte-whatsapp:3010
      BAILEYS_API_KEY: ${BAILEYS_API_KEY:?BAILEYS_API_KEY is required}
      BAILEYS_WEBHOOK_SECRET: ${BAILEYS_WEBHOOK_SECRET:?BAILEYS_WEBHOOK_SECRET is required}
      BAILEYS_INSTANCE_ID: ${BAILEYS_INSTANCE_ID:-default}
      FORTE_STORAGE_ENDPOINT: ${FORTE_STORAGE_ENDPOINT:-http://seaweedfs:8333}
      FORTE_STORAGE_REGION: ${FORTE_STORAGE_REGION:-us-east-1}
      FORTE_STORAGE_BUCKET: ${FORTE_STORAGE_BUCKET:-forte-private}
      FORTE_STORAGE_ACCESS_KEY: ${FORTE_STORAGE_ACCESS_KEY:?FORTE_STORAGE_ACCESS_KEY is required}
      FORTE_STORAGE_SECRET_KEY: ${FORTE_STORAGE_SECRET_KEY:?FORTE_STORAGE_SECRET_KEY is required}
      FORTE_STORAGE_FORCE_PATH_STYLE: ${FORTE_STORAGE_FORCE_PATH_STYLE:-true}
    ports: ["${PANEL_PORT:-3002}:3000"]
    depends_on:
      postgres_panel: { condition: service_healthy }
      redis_panel: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      forte-panel-migrations: { condition: service_completed_successfully }
    networks: [panel-network, whatsapp-network]

  forte-panel-worker:
    image: ${FORTE_PANEL_IMAGE:-ghcr.io/geordptoroy/forte-panel:latest}
    container_name: forte_panel_worker
    restart: unless-stopped
    command: ["./docker-entrypoint.sh", "worker"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      WORKSPACE_BOOTSTRAP_ENABLED: ${WORKSPACE_BOOTSTRAP_ENABLED:-false}
      LOCAL_AUTH_ENABLED: "true"
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@fortepanel.local}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?LOCAL_ADMIN_PASSWORD is required}
      PLATFORM_ADMIN_ACCOUNTS_JSON: ${PLATFORM_ADMIN_ACCOUNTS_JSON:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgresql://${PANEL_POSTGRES_USER:-forte_panel}:${PANEL_POSTGRES_PASSWORD}@postgres_panel:5432/${PANEL_POSTGRES_DB:-forte_panel}
      REDIS_URL: redis://redis_panel:6379/0
      RUN_MIGRATIONS: "false"
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3002}
      BAILEYS_REQUEST_TIMEOUT_MS: ${BAILEYS_REQUEST_TIMEOUT_MS:-8000}
      BAILEYS_BASE_URL: http://forte-whatsapp:3010
      BAILEYS_API_KEY: ${BAILEYS_API_KEY:?BAILEYS_API_KEY is required}
      BAILEYS_WEBHOOK_SECRET: ${BAILEYS_WEBHOOK_SECRET:?BAILEYS_WEBHOOK_SECRET is required}
      BAILEYS_INSTANCE_ID: ${BAILEYS_INSTANCE_ID:-default}
      FORTE_STORAGE_ENDPOINT: ${FORTE_STORAGE_ENDPOINT:-http://seaweedfs:8333}
      FORTE_STORAGE_REGION: ${FORTE_STORAGE_REGION:-us-east-1}
      FORTE_STORAGE_BUCKET: ${FORTE_STORAGE_BUCKET:-forte-private}
      FORTE_STORAGE_ACCESS_KEY: ${FORTE_STORAGE_ACCESS_KEY:?FORTE_STORAGE_ACCESS_KEY is required}
      FORTE_STORAGE_SECRET_KEY: ${FORTE_STORAGE_SECRET_KEY:?FORTE_STORAGE_SECRET_KEY is required}
      FORTE_STORAGE_FORCE_PATH_STYLE: ${FORTE_STORAGE_FORCE_PATH_STYLE:-true}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-1500}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      EVENT_WORKER_BATCH_SIZE: ${EVENT_WORKER_BATCH_SIZE:-10}
      EVENT_WORKER_MAX_ATTEMPTS: ${EVENT_WORKER_MAX_ATTEMPTS:-5}
    depends_on:
      postgres_panel: { condition: service_healthy }
      redis_panel: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      forte-panel-migrations: { condition: service_completed_successfully }
      forte-whatsapp: { condition: service_started }
    networks: [panel-network, whatsapp-network]

  forte-whatsapp:
    image: ${FORTE_WHATSAPP_IMAGE:-ghcr.io/geordptoroy/forte-whatsapp:latest}
    container_name: forte_whatsapp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      WHATSAPP_API_KEY: ${BAILEYS_API_KEY:?BAILEYS_API_KEY is required}
      WHATSAPP_SESSION_DIR: /app/sessions
      WHATSAPP_INSTANCE_ID: ${BAILEYS_INSTANCE_ID:-default}
      WHATSAPP_WEBHOOK_URL: http://forte-panel:3000/api/v1/webhooks/providers/baileys
      WHATSAPP_WEBHOOK_SECRET: ${BAILEYS_WEBHOOK_SECRET:?BAILEYS_WEBHOOK_SECRET is required}
      WHATSAPP_WEBHOOK_OUTBOX_DIR: /app/sessions/outbox
      WHATSAPP_WEBHOOK_MAX_ATTEMPTS: ${WHATSAPP_WEBHOOK_MAX_ATTEMPTS:-8}
      WHATSAPP_WEBHOOK_INITIAL_BACKOFF_MS: ${WHATSAPP_WEBHOOK_INITIAL_BACKOFF_MS:-1000}
      WHATSAPP_WEBHOOK_MAX_BACKOFF_MS: ${WHATSAPP_WEBHOOK_MAX_BACKOFF_MS:-60000}
    ports: ["127.0.0.1:${BAILEYS_PORT_PUBLIC:-3010}:3010"]
    volumes: ["forte_whatsapp_sessions:/app/sessions"]
    depends_on:
      forte-panel: { condition: service_started }
    networks: [whatsapp-network]

networks:
  panel-network:
    name: forte-panel-network
  whatsapp-network:
    name: ${COMPOSE_PROJECT_NAME:-forte-local}_whatsapp-network

volumes:
  forte_postgres_panel_data:
  forte_redis_panel_data:
  forte_whatsapp_sessions:
  forte_seaweedfs_data:
  forte_seaweedfs_config:
