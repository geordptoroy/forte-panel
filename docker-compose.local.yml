services:
  postgres_panel:
    image: postgres:16-alpine
    container_name: forte_postgres_panel
    restart: unless-stopped
    environment:
      POSTGRES_DB: forte_panel
      POSTGRES_USER: forte_panel
      POSTGRES_PASSWORD: forte_panel_local
    volumes:
      - forte_postgres_panel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forte_panel -d forte_panel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - panel-network

  redis_panel:
    image: redis:7-alpine
    container_name: forte_redis_panel
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - forte_redis_panel_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - panel-network

  forte-panel:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: forte_panel
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://forte_panel:forte_panel_local@postgres_panel:5432/forte_panel
      REDIS_URL: redis://redis_panel:6379/0
      RUN_MIGRATIONS: "true"
      PAPI_BASE_URL: http://pastorini_api:3000
      N8N_BASE_URL: http://n8n:5678
    ports:
      - "3000:3000"
    depends_on:
      postgres_panel:
        condition: service_healthy
      redis_panel:
        condition: service_healthy
    networks:
      - panel-network
      - pastorini-network

networks:
  panel-network:
    name: forte-panel-network
  pastorini-network:
    external: true
    name: ${PASTORINI_NETWORK:-forte-local_pastorini-network}

volumes:
  forte_postgres_panel_data:
  forte_redis_panel_data:
