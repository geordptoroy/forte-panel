name: Publish Forte Panel image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/geordptoroy/forte-panel
  WHATSAPP_IMAGE_NAME: ghcr.io/geordptoroy/forte-whatsapp

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forte_panel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forte_panel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WhatsApp gateway dependencies
        working-directory: forte-whatsapp
        run: npm ci
      - name: Typecheck
        run: pnpm check
      - name: Validate production configuration contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://synthetic.invalid/forte
          JWT_SECRET: synthetic-jwt-secret-with-at-least-32-characters
          FORTE_SECURITY_FAIL_CLOSED: "true"
          DEMO_MODE: "false"
          WORKSPACE_BOOTSTRAP_ENABLED: "false"
        run: pnpm check:production-config
      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forte_panel_test
          NODE_ENV: test
        run: pnpm exec drizzle-kit migrate
      - name: Tests (PostgreSQL required; zero skipped)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forte_panel_test
          JWT_SECRET: integration-test-secret-with-at-least-32-characters
          NODE_ENV: test
        run: |
          set -o pipefail
          pnpm test -- --reporter=verbose | tee vitest.log
          if grep -Eq '([1-9][0-9]* skipped|\[skipped\])' vitest.log; then
            echo 'Database-backed tests must not be skipped' >&2
            exit 1
          fi
      - name: Production build
        run: pnpm build
      - name: WhatsApp gateway tests and build
        working-directory: forte-whatsapp
        run: |
          npm test
          npm run check
          npm run build
      - name: Check tracked files for common secret assignments
        run: |
          if git grep -nE '(JWT_SECRET|(BAILEYS|WHATSAPP)_API_KEY|PANEL_POSTGRES_PASSWORD|OPENAI_API_KEY)=[^$<{[:space:]]{8,}' -- ':!*.lock' ':!*.example' ':!AUDITORIA-TECNICA-E-ROADMAP.md'; then
            echo 'Potential hard-coded secret found in tracked files' >&2
            exit 1
          fi

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: WhatsApp image metadata
        id: whatsapp-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WHATSAPP_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push WhatsApp gateway
        uses: docker/build-push-action@v6
        with:
          context: ./forte-whatsapp
          file: ./forte-whatsapp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.whatsapp-meta.outputs.tags }}
          labels: ${{ steps.whatsapp-meta.outputs.labels }}
