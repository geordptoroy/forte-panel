name: Publish Forte Panel image

on:
  push:
    branches: [main, docs/ai-admin-core-plan-2026-09-27]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/geordptoroy/forte-panel
  WHATSAPP_IMAGE_NAME: ghcr.io/geordptoroy/forte-whatsapp

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WhatsApp gateway dependencies
        working-directory: forte-whatsapp
        run: npm ci
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: WhatsApp gateway tests and build
        working-directory: forte-whatsapp
        run: |
          npm test
          npm run check
          npm run build
      - name: Check tracked files for common secret assignments
        run: |
          if git grep -nE '(JWT_SECRET|(BAILEYS|WHATSAPP)_API_KEY|PANEL_POSTGRES_PASSWORD|OPENAI_API_KEY)=[^$<{[:space:]]{8,}' -- ':!*.lock' ':!*.example' ':!AUDITORIA-TECNICA-E-ROADMAP.md'; then
            echo 'Potential hard-coded secret found in tracked files' >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: WhatsApp image metadata
        id: whatsapp-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WHATSAPP_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push WhatsApp gateway
        uses: docker/build-push-action@v6
        with:
          context: ./forte-whatsapp
          file: ./forte-whatsapp/Dockerfile
          push: true
          tags: ${{ steps.whatsapp-meta.outputs.tags }}
          labels: ${{ steps.whatsapp-meta.outputs.labels }}
