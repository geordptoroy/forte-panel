name: PostgreSQL integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forte_panel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d forte_panel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forte_panel_test
      JWT_SECRET: integration-test-secret-with-at-least-32-characters
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Baileys gateway dependencies
        run: npm ci --prefix forte-whatsapp --no-audit --no-fund

      - name: Typecheck Baileys gateway
        run: npm run check --prefix forte-whatsapp

      - name: Apply versioned migrations
        run: pnpm exec drizzle-kit migrate

      - name: Validate production configuration contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://synthetic.invalid/forte
          JWT_SECRET: synthetic-jwt-secret-with-at-least-32-characters
          FORTE_SECURITY_FAIL_CLOSED: "true"
          DEMO_MODE: "false"
          WORKSPACE_BOOTSTRAP_ENABLED: "false"
          BAILEYS_BASE_URL: http://forte-whatsapp:3010
          BAILEYS_API_KEY: synthetic-baileys-api-key-with-at-least-32-characters
          BAILEYS_WEBHOOK_SECRET: synthetic-baileys-webhook-secret-with-at-least-32-characters
          WHATSAPP_SESSION_ENCRYPTION_KEY: synthetic-session-key-012345678901234567890123456789
        run: pnpm check:production-config

      - name: Run complete test suite against PostgreSQL
        run: |
          set -o pipefail
          pnpm test -- --reporter=verbose 2>&1 | tee /tmp/postgres-vitest.log
          if grep -qE '\[skipped\]|[0-9]+ skipped' /tmp/postgres-vitest.log; then
            echo 'A PostgreSQL integration suite was skipped unexpectedly.' >&2
            exit 1
          fi

      - name: Verify migration journal is tracked
        run: test -s drizzle-pg/meta/_journal.json
